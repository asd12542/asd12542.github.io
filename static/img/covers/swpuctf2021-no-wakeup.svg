<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Consolas, 'Courier New', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9a8cc"/>
      <stop offset="1" stop-color="#8f6d9c"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.2" fill="#ffffff" opacity="0.28"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <circle cx="1010" cy="65" r="200" fill="#ffffff" opacity="0.10"/>
  <circle cx="125" cy="585" r="150" fill="#ffffff" opacity="0.08"/>

  <!-- sleeping box (unserialized object that won't wake up) -->
  <g transform="translate(600,360)" stroke="#ffffff" stroke-opacity="0.92" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M -110,0 v 90 h 220 v -90"/>
    <path d="M -110,0 L -40,-45 M 110,0 L 40,-45"/>
    <path d="M -40,-45 h 80"/>
  </g>
  <!-- z z z -->
  <g fill="#ffffff" fill-opacity="0.95">
    <text x="770" y="215" font-size="56" font-style="italic">z</text>
    <text x="830" y="160" font-size="72" font-style="italic">Z</text>
    <text x="905" y="105" font-size="88" font-style="italic">z</text>
  </g>

  <text x="70" y="560" font-size="34" letter-spacing="6" fill="#ffffff" opacity="0.9">SWPUCTF 2021</text>
  <rect x="62" y="575" width="120" height="6" rx="3" fill="#ffffff" opacity="0.6"/>
</svg>
