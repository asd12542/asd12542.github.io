<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Consolas, 'Courier New', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2b495"/>
      <stop offset="1" stop-color="#d97b5f"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.2" fill="#ffffff" opacity="0.28"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <circle cx="1010" cy="65" r="200" fill="#ffffff" opacity="0.10"/>
  <circle cx="125" cy="585" r="150" fill="#ffffff" opacity="0.08"/>

  <!-- two different inputs -->
  <g transform="translate(600,235)" stroke="#ffffff" stroke-opacity="0.92" stroke-width="9" fill="none" stroke-linecap="round">
    <rect x="-140" y="-40" width="100" height="80" rx="16"/>
    <rect x="40"   y="-40" width="100" height="80" rx="16"/>
  </g>
  <!-- weak equality -->
  <g transform="translate(600,290)" stroke="#ffffff" stroke-opacity="0.92" stroke-width="10" stroke-linecap="round">
    <path d="M -60,0 h 120 M -60,34 h 120"/>
  </g>
  <!-- md5 0e -->
  <g transform="translate(600,430)" fill="#ffffff" fill-opacity="0.95">
    <text x="0" y="0" font-size="130" text-anchor="middle" font-weight="bold">0e</text>
  </g>

  <text x="70" y="560" font-size="34" letter-spacing="6" fill="#ffffff" opacity="0.9">SWPUCTF 2021</text>
  <rect x="62" y="575" width="120" height="6" rx="3" fill="#ffffff" opacity="0.6"/>
</svg>
