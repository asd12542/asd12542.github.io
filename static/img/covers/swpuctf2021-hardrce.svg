<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Consolas, 'Courier New', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8bf7a"/>
      <stop offset="1" stop-color="#c97b3d"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.2" fill="#ffffff" opacity="0.28"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <circle cx="1010" cy="65" r="200" fill="#ffffff" opacity="0.10"/>
  <circle cx="125" cy="585" r="150" fill="#ffffff" opacity="0.08"/>

  <!-- terminal window -->
  <g transform="translate(600,315)" stroke="#ffffff" stroke-opacity="0.92" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-150" y="-105" width="300" height="210" rx="14"/>
    <path d="M -150,-55 h 300"/>
    <circle cx="-115" cy="-80" r="7" fill="#ffffff" stroke="none" fill-opacity="0.9"/>
    <circle cx="-85"  cy="-80" r="7" fill="#ffffff" stroke="none" fill-opacity="0.7"/>
    <circle cx="-55"  cy="-80" r="7" fill="#ffffff" stroke="none" fill-opacity="0.45"/>
    <!-- prompt -->
    <path d="M -95,15 L -60,50 L -95,85"/>
    <path d="M -15,85 h 50"/>
  </g>

  <text x="70" y="560" font-size="34" letter-spacing="6" fill="#ffffff" opacity="0.9">SWPUCTF 2021</text>
  <rect x="62" y="575" width="120" height="6" rx="3" fill="#ffffff" opacity="0.6"/>
</svg>
