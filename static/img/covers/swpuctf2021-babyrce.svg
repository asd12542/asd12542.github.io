<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Consolas, 'Courier New', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8c9a8"/>
      <stop offset="1" stop-color="#7a9c5f"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.2" fill="#ffffff" opacity="0.28"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <circle cx="1010" cy="65" r="200" fill="#ffffff" opacity="0.10"/>
  <circle cx="125" cy="585" r="150" fill="#ffffff" opacity="0.08"/>

  <!-- cookie -->
  <g transform="translate(440,315)" stroke="#ffffff" stroke-opacity="0.92" stroke-width="10" fill="none" stroke-linecap="round">
    <circle r="85"/>
    <circle cx="-28" cy="-20" r="9" fill="#ffffff" fill-opacity="0.85" stroke="none"/>
    <circle cx="25"  cy="-35" r="9" fill="#ffffff" fill-opacity="0.7"  stroke="none"/>
    <circle cx="35"  cy="20"  r="9" fill="#ffffff" fill-opacity="0.85" stroke="none"/>
    <circle cx="-15" cy="38"  r="9" fill="#ffffff" fill-opacity="0.6"  stroke="none"/>
    <circle cx="0"   cy="0"   r="9" fill="#ffffff" fill-opacity="0.5"  stroke="none"/>
  </g>
  <!-- arrow to terminal -->
  <g transform="translate(610,315)" stroke="#ffffff" stroke-opacity="0.92" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 0,0 h 60 M 60,0 L 32,-24 M 60,0 L 32,24"/>
  </g>
  <!-- mini terminal -->
  <g transform="translate(850,315)" stroke="#ffffff" stroke-opacity="0.92" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-90" y="-70" width="180" height="140" rx="12"/>
    <path d="M -90,-32 h 180"/>
    <path d="M -50,0 L -25,25 L -50,50"/>
    <path d="M 10,50 h 35"/>
  </g>

  <text x="70" y="560" font-size="34" letter-spacing="6" fill="#ffffff" opacity="0.9">SWPUCTF 2021</text>
  <rect x="62" y="575" width="120" height="6" rx="3" fill="#ffffff" opacity="0.6"/>
</svg>
