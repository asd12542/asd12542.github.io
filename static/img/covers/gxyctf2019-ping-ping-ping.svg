<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Consolas, 'Courier New', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cfc48a"/>
      <stop offset="1" stop-color="#8f8f4e"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.2" fill="#ffffff" opacity="0.28"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <circle cx="1010" cy="65" r="200" fill="#ffffff" opacity="0.10"/>
  <circle cx="125" cy="585" r="150" fill="#ffffff" opacity="0.08"/>

  <!-- ping / radar waves -->
  <g transform="translate(640,315)" stroke="#ffffff" stroke-opacity="0.92" stroke-width="10" fill="none" stroke-linecap="round">
    <circle cx="-120" cy="0" r="12" fill="#ffffff" fill-opacity="0.9" stroke="none"/>
    <path d="M -95,0 h 40"/>
    <path d="M -30,-30 A 42 42 0 0 1 -30,30"/>
    <path d="M 15,-55 A 77 77 0 0 1 15,55"/>
    <path d="M 60,-82 A 115 115 0 0 1 60,82"/>
    <path d="M 105,-110 A 160 160 0 0 1 105,110"/>
  </g>

  <text x="70" y="560" font-size="34" letter-spacing="6" fill="#ffffff" opacity="0.9">GXYCTF 2019</text>
  <rect x="62" y="575" width="120" height="6" rx="3" fill="#ffffff" opacity="0.6"/>
</svg>
