<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Consolas, 'Courier New', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e5a8a8"/>
      <stop offset="1" stop-color="#c26d6d"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.2" fill="#ffffff" opacity="0.28"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <circle cx="1000" cy="60" r="200" fill="#ffffff" opacity="0.10"/>
  <circle cx="120" cy="580" r="150" fill="#ffffff" opacity="0.08"/>

  <!-- document with folded corner -->
