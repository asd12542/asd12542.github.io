    <path d="M -45,-5 h 90 M -45,35 h 90 M -45,75 h 55"/>
  </g>
  <!-- encoding conversion arrows -->
  <g transform="translate(580,490)" stroke="#ffffff" stroke-opacity="0.92" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M -170,-5 h 240 M 70,-5 L 30,-33 M 70,-5 L 30,23"/>
    <path d="M 170,55 h -240 M -70,55 L -30,27 M -70,55 L -30,83"/>
  </g>

  <text x="70" y="560" font-size="34" letter-spacing="6" fill="#ffffff" opacity="0.9">CISCN 2026 / WEB</text>
  <rect x="62" y="575" width="120" height="6" rx="3" fill="#ffffff" opacity="0.6"/>
</svg>
