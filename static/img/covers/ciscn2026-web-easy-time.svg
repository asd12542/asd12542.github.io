<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Consolas, 'Courier New', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ec9b7"/>
      <stop offset="1" stop-color="#5f9c87"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.2" fill="#ffffff" opacity="0.28"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <circle cx="1010" cy="70" r="200" fill="#ffffff" opacity="0.10"/>
  <circle cx="130" cy="580" r="150" fill="#ffffff" opacity="0.08"/>

  <!-- clock -->
  <g transform="translate(540,320)" stroke="#ffffff" stroke-opacity="0.92" stroke-width="10" fill="none" stroke-linecap="round">
    <circle r="120"/>
    <path d="M 0,0 L 0,-72"/>
    <path d="M 0,0 L 52,30"/>
    <path d="M 0,-104 v 10 M 104,0 h -10 M 0,104 v -10 M -104,0 h 10"/>
  </g>
  <!-- interlocked zip links -->
  <g transform="translate(780,420)" stroke="#ffffff" stroke-opacity="0.92" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-130" y="-30" width="100" height="60" rx="14"/>
    <rect x="30" y="-30" width="100" height="60" rx="14"/>
    <path d="M -30,0 h 30"/>
  </g>

  <text x="70" y="560" font-size="34" letter-spacing="6" fill="#ffffff" opacity="0.9">CISCN 2026 / WEB</text>
  <rect x="62" y="575" width="120" height="6" rx="3" fill="#ffffff" opacity="0.6"/>
</svg>
