<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Consolas, 'Courier New', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6c28b"/>
      <stop offset="1" stop-color="#e8875f"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.2" fill="#ffffff" opacity="0.28"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <circle cx="1000" cy="60" r="200" fill="#ffffff" opacity="0.10"/>
  <circle cx="120" cy="580" r="150" fill="#ffffff" opacity="0.08"/>

  <!-- 3x3 word tiles -->
  <g transform="translate(570,330)" stroke="#ffffff" stroke-opacity="0.92" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-180" y="-120" width="82" height="58" rx="9"/>
    <rect x="-82"  y="-120" width="82" height="58" rx="9"/>
    <rect x="16"   y="-120" width="82" height="58" rx="9"/>
    <rect x="-180" y="-48"  width="82" height="58" rx="9"/>
    <rect x="16"   y="-48"  width="82" height="58" rx="9"/>
    <rect x="-180" y="24"   width="82" height="58" rx="9"/>
    <rect x="-82"  y="24"   width="82" height="58" rx="9"/>
    <rect x="16"   y="24"   width="82" height="58" rx="9"/>
    <!-- highlighted tile -->
    <rect x="-82" y="-48" width="82" height="58" rx="9" fill="#ffffff" fill-opacity="0.85" stroke="none"/>
    <!-- path traversal arrow escaping the grid -->
    <path d="M -60,-90 L 200,-260"/>
    <path d="M 200,-260 L 155,-258 M 200,-260 L 198,-215"/>
  </g>

  <text x="70" y="560" font-size="34" letter-spacing="6" fill="#ffffff" opacity="0.9">IMAGINARYCTF 2025</text>
  <rect x="62" y="575" width="120" height="6" rx="3" fill="#ffffff" opacity="0.6"/>
</svg>
